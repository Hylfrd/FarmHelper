plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

def modVersion = project.mod_version.toString()
def minecraftVersion = project.minecraft_version.toString()

version = modVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        farmhelper {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.google.code.gson:gson:2.13.2"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

tasks.named("processResources") {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named("jar", org.gradle.api.tasks.bundling.Jar) {
    description = "Assembles the deterministic FarmHelper runtime JAR."
    archiveFileName.set("FarmHelper-${minecraftVersion}.jar")
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.FAIL

    from(layout.projectDirectory.file("LICENSE")) {
        into("META-INF")
    }
    from(layout.projectDirectory.file("NOTICE")) {
        into("META-INF")
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java

            pom {
                name = "FarmHelper"
                description = "A modern Fabric rewrite focused on core farming macro behavior."
                url = "https://github.com/Hylfrd/FarmHelper"

                licenses {
                    license {
                        name = "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International"
                        url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
                        distribution = "repo"
                    }
                }
            }
        }
    }
}
