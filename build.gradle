plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

def modVersion = project.mod_version.toString()
def minecraftVersion = project.minecraft_version.toString()

version = modVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        farmhelper {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.google.code.gson:gson:2.13.2"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

def provenanceFile = layout.projectDirectory.file("dependency-provenance.json")

tasks.register("verifyDependencyProvenance") {
    group = "verification"
    description = "Verifies dependency-provenance.json against direct Gradle inputs and resolution."
    inputs.file(provenanceFile)
    inputs.properties([
        loomVersion: project.property("loom_version").toString(),
        minecraftVersion: project.property("minecraft_version").toString()
    ])

    doLast {
        def fail = { message ->
            throw new GradleException("Dependency provenance verification failed: ${message}")
        }
        def provenance = new groovy.json.JsonSlurper().parse(provenanceFile.asFile)
        if (provenance.schemaVersion != 1) {
            fail("unsupported schemaVersion ${provenance.schemaVersion}")
        }

        def declaredRuntime = configurations.implementation.dependencies.collectEntries { dependency ->
            if (dependency.group == null || dependency.name == null || dependency.version == null) {
                fail("implementation contains an unqualified direct dependency")
            }
            def coordinate = "${dependency.group}:${dependency.name}".toString()
            [(coordinate): dependency.version.toString()]
        }
        def resolveDirect = { configuration ->
            configuration.incoming.resolutionResult.root.dependencies.collectEntries { dependencyResult ->
                if (!(dependencyResult instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult)) {
                    fail("${configuration.name} contains an unresolved direct dependency")
                }
                def selected = dependencyResult.selected.id
                if (!(selected instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) {
                    fail("${configuration.name} resolved a non-module direct dependency")
                }
                def requested = dependencyResult.requested
                def requestedCoordinate = "${requested.group}:${requested.module}".toString()
                def selectedCoordinate = "${selected.group}:${selected.module}".toString()
                def resolvedCoordinate = "${selected.group}:${selected.module}:${selected.version}".toString()
                [(requestedCoordinate): [
                    coordinate: selectedCoordinate,
                    version: selected.version.toString(),
                    resolvedCoordinate: resolvedCoordinate
                ]]
            }
        }

        def resolvedAll = resolveDirect(configurations.runtimeClasspath)
        def resolvedRuntime = declaredRuntime.collectEntries { coordinate, ignoredVersion ->
            if (!resolvedAll.containsKey(coordinate)) {
                fail("implementation dependency ${coordinate} is absent from runtime resolution")
            }
            [(coordinate): resolvedAll[coordinate]]
        }

        def runtimeEntries = provenance.runtimeDependencies
        if (!(runtimeEntries instanceof List)) {
            fail("runtimeDependencies must be an array")
        }
        def runtimeByCoordinate = runtimeEntries.collectEntries { entry ->
            [(entry.coordinate.toString()): entry]
        }
        if (runtimeByCoordinate.size() != runtimeEntries.size()) {
            fail("runtimeDependencies contains duplicate coordinates")
        }

        def expectedSources = [
            "net.fabricmc:fabric-loader": "Fabric Maven",
            "net.fabricmc.fabric-api:fabric-api": "Fabric Maven",
            "com.google.code.gson:gson": "Maven Central"
        ]
        if (runtimeByCoordinate.keySet().toList().sort() != declaredRuntime.keySet().toList().sort()) {
            fail("runtimeDependencies coordinates do not match implementation")
        }
        runtimeByCoordinate.each { coordinate, entry ->
            def resolved = resolvedRuntime[coordinate]
            if (entry.declaredVersion.toString() != declaredRuntime[coordinate]) {
                fail("${coordinate} declaredVersion is stale (provenance=${entry.declaredVersion}, build=${declaredRuntime[coordinate]})")
            }
            if (entry.resolvedVersion.toString() != resolved.version.toString()) {
                fail("${coordinate} resolvedVersion is stale")
            }
            if (entry.source.toString() != expectedSources[coordinate]) {
                fail("${coordinate} source is inconsistent")
            }
            if (entry.direct != true || entry.bundled != false) {
                fail("${coordinate} must be direct and external to the runtime JAR")
            }
        }

        def declaredMinecraftDependencies = configurations.minecraft.dependencies.toList()
        if (declaredMinecraftDependencies.size() != 1) {
            fail("minecraft must contain exactly one direct dependency")
        }
        def minecraftDependency = declaredMinecraftDependencies[0]
        def declaredMinecraftCoordinate =
                "${minecraftDependency.group}:${minecraftDependency.name}:${minecraftDependency.version}"
        def resolvedMinecraftCandidates = resolvedAll.values().findAll { component ->
            component.coordinate.startsWith("net.minecraft:minecraft-common-") &&
                    component.version == minecraftDependency.version.toString()
        }
        if (resolvedMinecraftCandidates.size() != 1) {
            fail("expected one Loom-selected Minecraft platform component, found ${resolvedMinecraftCandidates.size()}")
        }
        def resolvedMinecraft = resolvedMinecraftCandidates[0]
        def platformEntries = provenance.platformDependencies
        if (!(platformEntries instanceof List) || platformEntries.size() != 1) {
            fail("platformDependencies must contain exactly one entry")
        }
        def platform = platformEntries[0]
        if (platform.coordinate.toString() != resolvedMinecraft.coordinate.toString() ||
                platform.declaredVersion.toString() != minecraftDependency.version.toString() ||
                platform.resolvedVersion.toString() != resolvedMinecraft.version.toString() ||
                platform.configuration.toString() != "minecraft" ||
                platform.provenance.declaredCoordinate.toString() != declaredMinecraftCoordinate ||
                platform.provenance.resolvedCoordinate.toString() != resolvedMinecraft.resolvedCoordinate ||
                platform.provenance.resolvedBy.toString() != "Fabric Loom") {
            fail("platform dependency provenance is inconsistent with Gradle resolution")
        }
        if (platform.source.toString() != "Fabric Loom" ||
                platform.direct != true || platform.bundled != false ||
                platform.license.status.toString() != "not-provided" ||
                platform.redistribution.status.toString() != "not-redistributed") {
            fail("platform dependency license or redistribution metadata is inconsistent")
        }

        def loomVersion = project.property("loom_version").toString()
        if (loomVersion.contains("SNAPSHOT") || !(loomVersion ==~ /^\d+\.\d+\.\d+$/)) {
            fail("loom_version must be a pinned release version")
        }

        logger.lifecycle("Dependency provenance verified: ${runtimeEntries.size()} runtime dependencies, 1 platform dependency, Loom ${loomVersion}.")
    }
}

tasks.named("check") {
    dependsOn("verifyDependencyProvenance")
}

tasks.named("processResources") {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named("jar", org.gradle.api.tasks.bundling.Jar) {
    description = "Assembles the deterministic FarmHelper runtime JAR."
    archiveFileName.set("FarmHelper-${minecraftVersion}.jar")
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.FAIL

    from(layout.projectDirectory.file("LICENSE")) {
        into("META-INF")
    }
    from(layout.projectDirectory.file("NOTICE")) {
        into("META-INF")
    }
}

def packagedClientJar = providers.gradleProperty("packagedClientJar")
def packagedClientDependency = providers.gradleProperty("packagedClientDependency")
def packagedClientRunDir = providers.gradleProperty("packagedClientRunDir")

tasks.register("verifyPackagedClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = "verification"
    description = "Launches a production-mode client with one explicitly supplied FarmHelper JAR."

    // This task deliberately does not assemble the candidate. The wrapper hashes the
    // already-built artifact, then excludes jar during launch so the file cannot change.
    getMods().setFrom(packagedClientJar.map { project.file(it) })
    getMods().from(packagedClientDependency.map { project.file(it) })
    getRunDir().set(project.layout.dir(packagedClientRunDir.map { project.file(it) }))
    getJvmArgs().addAll([
        "-Dfabric.development=false",
        "-Dfabric.noGui=true",
        "-Dfabric.log.level=info",
        "-Xlog:class+load=info:file=class-load.log"
    ])
    getJvmArgs().add(packagedClientRunDir.map {
        "-Dfabric.modsFolder=${project.file(it).absolutePath}\\mods"
    })
    getProgramArgs().addAll([
        "--username", "FarmHelperVerification",
        "--uuid", "00000000-0000-0000-0000-000000000000",
        "--accessToken", "offline-verification-token",
        "--version", minecraftVersion,
        "--versionType", "release"
    ])

    doFirst {
        if (!packagedClientJar.isPresent() || !packagedClientDependency.isPresent() ||
                !packagedClientRunDir.isPresent()) {
            throw new GradleException(
                    "verifyPackagedClient requires -PpackagedClientJar, -PpackagedClientDependency, " +
                            "and -PpackagedClientRunDir")
        }

        def expectedJar = project.file(packagedClientJar.get()).canonicalFile
        def expectedDependency = project.file(packagedClientDependency.get()).canonicalFile
        def configuredMods = getMods().files.collect { it.canonicalFile }
        if (configuredMods.size() != 2 ||
                configuredMods.count { it == expectedJar } != 1 ||
                configuredMods.count { it == expectedDependency } != 1 ||
                expectedJar == expectedDependency) {
            throw new GradleException(
                    "verifyPackagedClient requires exactly one candidate and one approved dependency: " +
                            "${expectedJar}, ${expectedDependency}; " +
                            "effective files were ${configuredMods}")
        }

        def expectedRunDir = project.file(packagedClientRunDir.get()).canonicalFile
        if (getRunDir().get().asFile.canonicalFile != expectedRunDir) {
            throw new GradleException(
                    "verifyPackagedClient run directory was not bound to ${expectedRunDir}")
        }

        logger.lifecycle("Packaged client candidate: ${expectedJar}")
        logger.lifecycle("Packaged client run directory: ${expectedRunDir}")
        logger.lifecycle("Packaged client mode: production; fabric.development=false")
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java

            pom {
                name = "FarmHelper"
                description = "A modern Fabric rewrite focused on core farming macro behavior."
                url = "https://github.com/Hylfrd/FarmHelper"

                licenses {
                    license {
                        name = "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International"
                        url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
                        distribution = "repo"
                    }
                }
            }
        }
    }
}
